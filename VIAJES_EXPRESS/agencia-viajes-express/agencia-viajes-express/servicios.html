<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de 10 paquetes de viaje de Agencia de Viajes Express.">
  <title>Agencia de Viajes Express | Servicios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header id="menu-principal"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1><i class="bi bi-suitcase-lg me-2"></i>Paquetes de viaje</h1>
        <p>Elige entre nuestros 10 paquetes y descubre todo lo que incluyen.</p>
      </div>
    </section>

    <section class="container my-5">
      <!-- Las tarjetas se generan con paquetes.js -->
      <div id="catalogo" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center"></div>
    </section>
  </main>

  <!-- Modal de detalle del paquete -->
  <div class="modal fade" id="modalPaquete" tabindex="-1" aria-labelledby="modalPaqueteTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalPaqueteTitulo"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-md-6">
              <img id="modalImagen" class="modal-img mb-3" src="" alt="">
              <p id="modalDescripcion"></p>
              <p class="mb-1"><i class="bi bi-clock text-info me-2"></i><strong>Duración:</strong> <span
                  id="modalDuracion"></span></p>
              <p class="mb-0"><i class="bi bi-tag-fill text-danger me-2"></i><strong>Precio:</strong> <span
                  id="modalPrecio"></span></p>
            </div>
            <div class="col-md-6">
              <h6 class="mb-2"><i class="bi bi-check2-circle text-success me-2"></i>Qué incluye</h6>
              <ul id="modalIncluye" class="lista-incluye mb-4"></ul>

              <h6 class="mb-2"><i class="bi bi-shield-exclamation text-warning me-2"></i>Políticas de cancelación</h6>
              <div class="politicas">
                <ul id="modalPoliticas" class="mb-0 ps-3"></ul>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <a id="modalReservar" href="registro.html" class="btn btn-accent">
            <i class="bi bi-person-plus me-1"></i>Me interesa este paquete
          </a>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pie-pagina"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/paquetes.js"></script>
</body>

</html>
