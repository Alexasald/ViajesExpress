<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registro de interesados en paquetes de viaje.">
  <title>Agencia de Viajes Express | Registro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header id="menu-principal"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1><i class="bi bi-person-plus me-2"></i>Registro de clientes</h1>
        <p>Cuéntanos a dónde quieres viajar y te contactaremos con la mejor propuesta.</p>
      </div>
    </section>

    <section class="container my-5">
      <div id="alerta-registro"></div>

      <div class="row g-4 justify-content-center">
        <div class="col-lg-7 d-flex">
          <div class="card form-card w-100">
            <div class="card-body p-4">
              <form id="form-registro" novalidate>
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Ej. María López Hernández"
                    autocomplete="name">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                  <label for="correo" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com"
                    autocomplete="email">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                  <label for="destino" class="form-label">Destino de interés</label>
                  <select class="form-select" id="destino">
                    <option value="">Selecciona un paquete...</option>
                  </select>
                  <div class="invalid-feedback"></div>
                </div>

                <div class="row">
                  <div class="col-sm-6 mb-3">
                    <label for="personas" class="form-label">Número de personas</label>
                    <input type="number" class="form-control" id="personas" min="1" max="20" placeholder="1 - 20">
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-sm-6 mb-3">
                    <label for="fecha" class="form-label">Fecha tentativa de viaje</label>
                    <input type="date" class="form-control" id="fecha">
                    <div class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="comentarios" class="form-label">Comentarios adicionales <span
                      class="text-muted fw-normal">(opcional)</span></label>
                  <textarea class="form-control" id="comentarios" rows="3"
                    placeholder="Alergias, preferencias de hotel, celebraciones especiales..."></textarea>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2">
                  <button type="submit" class="btn btn-accent btn-lg flex-fill">
                    <i class="bi bi-send-check me-2"></i>Registrarme
                  </button>
                  <button type="reset" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-eraser me-1"></i>Limpiar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-5 d-flex">
          <aside class="info-lateral p-4 w-100">
            <h4 class="mb-3">¿Cómo funciona?</h4>
            <p class="d-flex"><i class="bi bi-1-circle-fill me-3 fs-4"></i><span>Elige el destino que más te guste del
                catálogo.</span></p>
            <p class="d-flex"><i class="bi bi-2-circle-fill me-3 fs-4"></i><span>Completa el formulario con tus datos y
                fecha tentativa.</span></p>
            <p class="d-flex"><i class="bi bi-3-circle-fill me-3 fs-4"></i><span>Tu registro se guarda y un asesor te
                contactará.</span></p>
            <hr class="border-light">
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="pie-pagina"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/paquetes.js"></script>
  <script src="js/registro.js"></script>
</body>

</html>
