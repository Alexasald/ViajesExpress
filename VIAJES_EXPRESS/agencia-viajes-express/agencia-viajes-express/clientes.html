<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lista de clientes registrados en Agencia de Viajes Express.">
  <title>Agencia de Viajes Express | Lista de Clientes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header id="menu-principal"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1><i class="bi bi-people me-2"></i>Lista de clientes</h1>
        <p>Clientes interesados registrados en este navegador.</p>
      </div>
    </section>

    <section class="container my-5">
      <div id="alerta-clientes"></div>

      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
        <h4 class="mb-0">
          Clientes registrados
          <span id="contador-clientes" class="badge rounded-pill text-bg-info">0</span>
        </h4>
        <button type="button" id="btn-exportar" class="btn btn-turquesa">
          <i class="bi bi-file-earmark-arrow-down me-2"></i>Exportar a TXT
        </button>
      </div>

      <!-- Tabla (las filas se generan con clientes.js desde localStorage) -->
      <div id="contenedor-tabla" class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover tabla-clientes mb-0">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Email</th>
              <th scope="col">Destino</th>
              <th scope="col" class="text-center">Número de Personas</th>
              <th scope="col">Fecha</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes"></tbody>
        </table>
      </div>

      <!-- Mensaje cuando no hay registros -->
      <div id="estado-vacio" class="estado-vacio d-none">
        <i class="bi bi-inbox"></i>
        <h5 class="mt-3">Aún no hay clientes registrados</h5>
        <p>Cuando alguien se registre, aparecerá aquí automáticamente.</p>
        <a href="registro.html" class="btn btn-accent">
          <i class="bi bi-person-plus me-1"></i>Ir al registro
        </a>
      </div>
    </section>
  </main>

  <div id="pie-pagina"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/clientes.js"></script>
</body>

</html>
